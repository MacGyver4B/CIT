image: atlassian/default-image:4
pipelines:
  default:
    - step: 
        name: Run tests with sanitizer
        script:
          - make -j2 asantest
            ENABLE_WERROR=1
    - step:
        name: Build distribution packages
        trigger: manual
        script:
          - echo Building distribution packages...
    - parallel:
          - step:
              name: Create and test source tarball
              script:
                - make -j2 dist-check
                  ENABLE_WERROR=1
              artifacts:
                - cc1541*.tar.*
                - cc1541*.zip
          - step:
              name: Build and test Linux glibc
              script:
                - export DEB_BUILD_MAINT_OPTIONS="hardening=+all"
                - export CPPFLAGS="$(dpkg-buildflags --get CPPFLAGS)"
                - export CFLAGS="$(dpkg-buildflags --get CFLAGS)"
                - export CXXFLAGS="$(dpkg-buildflags --get CXXFLAGS)"
                - export LDFLAGS="$(dpkg-buildflags --get LDFLAGS)"
                - make -j2 all check
                  CFLAGS="$CFLAGS"
                  CPPFLAGS="$CPPFLAGS"
                  CXXFLAGS="$CXXFLAGS"
                  LDFLAGS="$LDFLAGS -w -s"
                  ENABLE_WERROR=1
                - mv cc1541 cc1541_lin_glibc_x86
              artifacts:
                - cc1541_lin_glibc_x86
          - step:
              name: Build and test Windows
              image: purplekarrot/mingw-w64-x86-64
              script:
                - make -j2 cc1541 test_cc1541
                  CC=x86_64-w64-mingw32-gcc
                  LDFLAGS="-w -s"
                  ENABLE_WERROR=1
                - wine ./test_cc1541.exe ./cc1541.exe
              artifacts:
                - cc1541.exe
          - step:
              name: Build MacOS
              image: andrewd/osxcross
              script:
                - make -j2 cc1541 test_cc1541
                  CC=o64-clang
                  LDFLAGS="-w -s"
                  ENABLE_WERROR=1
                - mv cc1541 cc1541_mac
                - mv test_cc1541 test_cc1541_mac
              artifacts:
                - cc1541_mac
                - test_cc1541_mac
    - step:
        name: Create binary package
        image: kramos/alpine-zip
        script:
          - export VERSION="$(grep "#define VERSION" cc1541.c | cut -d\" -f2)"
          - zip -o cc1541_bin-$VERSION.zip cc1541_lin_glibc_x86 cc1541.exe cc1541_mac LICENSE.txt README.md
        artifacts:
          - cc1541_bin*.zip
    - step:
        name: Deploy html documentation
        deployment: production
        trigger: manual
        script:
          - pipe: atlassian/sftp-deploy:0.5.11
            variables:
              USER: 'bitbucket@acoustic-velocity.com'
              SERVER: 'ssh.strato.de'
              REMOTE_PATH: '/'
              LOCAL_PATH: 'doc/*'
              PASSWORD: $STRATO_BITBUCKET_PASSWORD
    - step:
        name: Deploy to Bitbucket downloads
        script:
          - export VERSION="$(grep "#define VERSION" cc1541.c | cut -d\" -f2)"
          - pipe: atlassian/bitbucket-upload-file:0.3.4
            variables:
              BITBUCKET_USERNAME: $BITBUCKET_USERNAME
              BITBUCKET_APP_PASSWORD: $BITBUCKET_APP_PASSWORD
              FILENAME: 'cc1541-$VERSION.tar.* cc1541-$VERSION.zip cc1541_bin-$VERSION.zip'
