# Build and test. Started by hand only (Actions tab -> "build" -> Run workflow),
# so pushes never trigger a build.
name: build

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 and Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine64
      - name: Build
        run: |
          make -j2 cc1541 test_cc1541 CC=x86_64-w64-mingw32-gcc LDFLAGS="-static -s" ENABLE_WERROR=1
          mv cc1541 cc1541.exe
          mv test_cc1541 test_cc1541.exe
      - name: Test (Wine)
        run: WINEDEBUG=-all wine64 ./test_cc1541.exe ./cc1541.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            cc1541.exe
            LICENSE.txt
            README.md

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (with sanitizers)
        run: make -j2 asantest ENABLE_WERROR=1
      - name: Build
        run: make -j2 all check ENABLE_WERROR=1 LDFLAGS="-s"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            cc1541
            LICENSE.txt
            README.md

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make -j2 all check ENABLE_WERROR=1
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            cc1541
            LICENSE.txt
            README.md
