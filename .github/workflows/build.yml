# Build and test. Started by hand only (Actions tab -> "build" -> Run workflow),
# so pushes never trigger a build.
name: build

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 and Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine64
      - name: Build
        run: |
          make -j2 cit test_cit CC=x86_64-w64-mingw32-gcc LDFLAGS="-static -s" ENABLE_WERROR=1
          # MinGW appends .exe itself: cit.exe, test_cit.exe
      - name: Test (Wine)
        run: WINEDEBUG=-all wine64 ./test_cit.exe ./cit.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            cit.exe
            LICENSE.txt
            README.md

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # make compare builds cc1541 4.2 from history
      - name: Build and test (with sanitizers)
        run: make -j2 asantest ENABLE_WERROR=1
      - name: Build
        run: make -j2 all check ENABLE_WERROR=1 LDFLAGS="-s"
      - name: Compare with cc1541 4.2
        run: make compare REF=origin/cc1541-4.2
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            cit
            LICENSE.txt
            README.md

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make -j2 all check ENABLE_WERROR=1
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            cit
            LICENSE.txt
            README.md
